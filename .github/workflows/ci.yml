name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  backend:
    name: Backend (analyze + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_spend
          POSTGRES_USER: smart_spend
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_spend -d smart_spend"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: smart_spend
      POSTGRES_USER: smart_spend
      POSTGRES_PASSWORD: ci-test-only
      JWT_SECRET: ci-test-only-jwt-secret-of-at-least-32-bytes
    defaults:
      run:
        working-directory: server_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart pub get --enforce-lockfile
      - run: dart analyze lib test bin
      - run: dart test --coverage-path=coverage/lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: server_app/coverage/lcov.info
          if-no-files-found: error

  frontend:
    name: Frontend (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_application
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: flutter_application/coverage/lcov.info
          if-no-files-found: error

  sonar:
    name: SonarQube Cloud scan
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not available (e.g. pull request from a fork); skipping the scan."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: env.SONAR_TOKEN != ''
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve dependencies for the Dart analyzer
        if: env.SONAR_TOKEN != ''
        run: |
          (cd server_app && dart pub get --enforce-lockfile)
          (cd flutter_application && flutter pub get --enforce-lockfile)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage-backend
          path: server_app/coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage-frontend
          path: flutter_application/coverage
      - name: Make frontend lcov paths absolute
        if: env.SONAR_TOKEN != ''
        run: |
          sed -i "s|^SF:lib/|SF:${GITHUB_WORKSPACE}/flutter_application/lib/|" flutter_application/coverage/lcov.info
          grep '^SF:' server_app/coverage/lcov.info flutter_application/coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        if: env.SONAR_TOKEN != ''
