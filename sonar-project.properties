sonar.organization=jms1133
sonar.projectKey=jms1133_26Q4-pwe-smartspend
sonar.projectName=Smart Spend
sonar.sourceEncoding=UTF-8

sonar.exclusions=openapi/**,tools/**,**/build/**,**/.dart_tool/**,**/*.g.dart,**/*.png,**/*.jpg,**/*.ico,**/*.jar

# Test files are not classified as tests: under the "new analysis scope UX"
# the scanner ignores sonar.tests and sonar.test.inclusions ("configured but
# have no effect"), and the Dart files in test/ end up as main code with lines
# to cover. They are only excluded from coverage here; they are still
# analyzed for issues.
sonar.coverage.exclusions=**/test/**

sonar.dart.lcov.reportPaths=server_app/coverage/lcov.info,flutter_application/coverage/lcov.info
