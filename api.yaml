openapi: 3.0.0
info:
  title: Smart Spend API
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Register a new user account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: The created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Username or password does not meet the rules
        '409':
          description: The username is already taken
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      summary: Log in and receive a bearer token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: A signed access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          description: Malformed request body
        '401':
          description: Unknown username or wrong password (indistinguishable)
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /chat:
    post:
      summary: Send a message to ChatGPT
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '200':
          description: Successful response from ChatGPT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /classify:
    post:
      summary: Classify raw expense text into a structured ExpenseInput
      operationId: classifyText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyInput'
      responses:
        '200':
          description: The structured expense parsed from the text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /expenses:
    get:
      summary: List the current user's expenses
      operationId: listExpenses
      responses:
        '200':
          description: A list of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a new expense
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '201':
          description: The created expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /expenses/{id}:
    put:
      summary: Update an existing expense
      operationId: updateExpense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '200':
          description: The updated expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '404':
          description: No expense with this id for the current user
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Delete an expense
      operationId: deleteExpense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Expense deleted successfully
        '404':
          description: No expense with this id for the current user
        '401':
          $ref: '#/components/responses/Unauthorized'
  /categories:
    get:
      summary: List the current user's categories
      operationId: listCategories
      responses:
        '200':
          description: A list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a category if it does not already exist (find-or-create)
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: The existing category matching the name (case-insensitive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '201':
          description: The newly created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing, invalid or expired bearer token
    TooManyRequests:
      description: Too many attempts; retry after the number of seconds in Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
  schemas:
    Credentials:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: >
            3-32 characters from [a-z0-9._-]. The server trims and lowercases
            it before validating, storing and comparing.
          minLength: 3
          maxLength: 32
        password:
          type: string
          description: 8-72 bytes in UTF-8 (bcrypt ignores bytes after 72).
          minLength: 8
    User:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: integer
        username:
          type: string
    AuthToken:
      type: object
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: HS256-signed JWT, sent as the bearer token in the Authorization header.
        expiresAt:
          type: string
          format: date-time
    Message:
      type: object
      required:
        - timestamp
        - message
        - author
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        author:
          type: string
          enum:
            - user
            - system
            - ai
    ClassifyInput:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: >
            Raw natural-language expense text to be parsed by the AI model
            into a structured ExpenseInput (e.g. "I spent 15 euros on cinema
            tickets").
    ExpenseInput:
      type: object
      required:
        - title
        - category
        - amount
      properties:
        title:
          type: string
        category:
          type: string
          description: >
            The expense category as free text. No longer enum-constrained:
            categories are managed as data (see the /categories endpoints) so
            the AI (or user) can introduce new ones. On create/update the
            server find-or-creates the matching category (case-insensitive).
        amount:
          type: number
          format: double
        description:
          type: string
        subcategory:
          type: string
          description: >
            Optional free-text secondary tag for expenses that span two
            categories (e.g. "Hundehaftpflichtversicherung" is insurance
            but also pet-related). Not enum-constrained on purpose —
            revisit if this needs structure later.
    Expense:
      allOf:
        - $ref: '#/components/schemas/ExpenseInput'
        - type: object
          required:
            - id
            - timestamp
          properties:
            id:
              type: integer
            timestamp:
              type: string
              format: date-time
    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The category name (free text, case-insensitive on match).
    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer