openapi: 3.0.0
info:
  title: Smart Spend API
  version: 1.0.0
paths:
  /chat:
    post:
      summary: Send a message to ChatGPT
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '200':
          description: Successful response from ChatGPT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /classify:
    post:
      summary: Classify raw expense text into a structured ExpenseInput
      operationId: classifyText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyInput'
      responses:
        '200':
          description: The structured expense parsed from the text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseInput'
  /expenses:
    get:
      summary: List all expenses
      operationId: listExpenses
      responses:
        '200':
          description: A list of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
    post:
      summary: Create a new expense
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '201':
          description: The created expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
  /expenses/{id}:
    put:
      summary: Update an existing expense
      operationId: updateExpense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '200':
          description: The updated expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
    delete:
      summary: Delete an expense
      operationId: deleteExpense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Expense deleted successfully
  /categories:
    get:
      summary: List all known expense categories
      operationId: listCategories
      responses:
        '200':
          description: A list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Create a category if it does not already exist (find-or-create)
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: The existing category matching the name (case-insensitive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '201':
          description: The newly created category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
components:
  schemas:
    Message:
      type: object
      required:
        - timestamp
        - message
        - author
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        author:
          type: string
          enum:
            - user
            - system
            - ai
    ClassifyInput:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: >
            Raw natural-language expense text to be parsed by the AI model
            into a structured ExpenseInput (e.g. "I spent 15 euros on cinema
            tickets").
    ExpenseInput:
      type: object
      required:
        - title
        - category
        - amount
      properties:
        title:
          type: string
        category:
          type: string
          description: >
            The expense category as free text. No longer enum-constrained:
            categories are managed as data (see the /categories endpoints) so
            the AI (or user) can introduce new ones. On create/update the
            server find-or-creates the matching category (case-insensitive).
        amount:
          type: number
          format: double
        description:
          type: string
        subcategory:
          type: string
          description: >
            Optional free-text secondary tag for expenses that span two
            categories (e.g. "Hundehaftpflichtversicherung" is insurance
            but also pet-related). Not enum-constrained on purpose —
            revisit if this needs structure later.
    Expense:
      allOf:
        - $ref: '#/components/schemas/ExpenseInput'
        - type: object
          required:
            - id
            - timestamp
          properties:
            id:
              type: integer
            timestamp:
              type: string
              format: date-time
    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The category name (free text, case-insensitive on match).
    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          required:
            - id
          properties:
            id:
              type: integer