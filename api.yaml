openapi: 3.0.0
info:
  title: ChatGPT Web App API
  version: 1.0.0
paths:
  /chat:
    post:
      summary: Send a message to ChatGPT
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '200':
          description: Successful response from ChatGPT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
components:
  schemas:
    Message:
      type: object
      required:
        - timestamp
        - message
        - author
      properties:
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        author:
          type: string
          enum:
            - user
            - system
            - ai